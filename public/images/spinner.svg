<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.5; }
      }
      .spinner-circle {
        transform-origin: 50px 50px;
        animation: spin 0.9s linear infinite;
      }
      .pulse-circle {
        animation: pulse 1.8s ease-in-out infinite;
      }
    </style>
  </defs>
  
  <!-- Light theme (default) -->
  <g id="light-theme">
    <!-- Background circle -->
    <circle cx="50" cy="50" r="42" fill="#f1f1f1" opacity="0.4"/>
    
    <!-- Static track -->
    <circle 
      cx="50" 
      cy="50" 
      r="36" 
      fill="none" 
      stroke="#10b981"
      stroke-width="2.5" 
      opacity="0.15"
    />
    
    <!-- Pulsing center -->
    <circle class="pulse-circle" cx="50" cy="50" r="16" fill="#10b981" opacity="0.2"/>
    
    <!-- Animated spinner arc -->
    <g class="spinner-circle">
      <circle 
        cx="50" 
        cy="50" 
        r="36" 
        fill="none" 
        stroke="#059669"
        stroke-width="4" 
        stroke-linecap="round"
        stroke-dasharray="170 56"
        opacity="0.95"
      />
    </g>
  </g>
  
  <!-- Dark theme (activated via media query) -->
  <style>
    #dark-theme { display: none; }
    
    @media (prefers-color-scheme: dark) {
      #light-theme { display: none; }
      #dark-theme { display: block; }
    }
  </style>
  
  <g id="dark-theme">
    <!-- Background circle -->
    <circle cx="50" cy="50" r="42" fill="#343a40" opacity="0.5"/>
    
    <!-- Static track -->
    <circle 
      cx="50" 
      cy="50" 
      r="36" 
      fill="none" 
      stroke="#10b981"
      stroke-width="2.5" 
      opacity="0.2"
    />
    
    <!-- Pulsing center -->
    <circle class="pulse-circle" cx="50" cy="50" r="16" fill="#34d399" opacity="0.25"/>
    
    <!-- Animated spinner arc -->
    <g class="spinner-circle">
      <circle 
        cx="50" 
        cy="50" 
        r="36" 
        fill="none" 
        stroke="#34d399"
        stroke-width="4" 
        stroke-linecap="round"
        stroke-dasharray="170 56"
        opacity="1"
      />
    </g>
  </g>
  
  <!-- Reduced motion support -->
  <style>
    @media (prefers-reduced-motion: reduce) {
      .spinner-circle { animation: spin 2s linear infinite; }
      .pulse-circle { animation: none; opacity: 0.15 !important; }
    }
  </style>
</svg>
